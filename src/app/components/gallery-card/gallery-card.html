<article class="relative size-full overflow-hidden rounded-lg">

    <img [src]="src()" [srcset]="srcset()"
         sizes="(min-width: 768px) 362px, 284px"
         [alt]="alt()" loading="lazy"
         class="absolute inset-0 size-full object-cover">
    <div class="absolute inset-x-0 bottom-0 h-[175px] bg-linear-to-b from-transparent to-black"></div>
    <div class="relative flex h-full flex-col justify-end gap-2 p-4 text-white">
        <h3 class="text-3xl/8.5 font-bold">{{title()}}</h3>
        <p class="text-base">{{subtitle()}}</p>
        <a href="#" class="flex w-fit items-center gap-1 mt-[25px] rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
            <span>{{downloadText()}}</span>
            <img src="icons/arrow-download.svg" width="24" height="24" alt="" class="w-6 h-6">
        </a>
    </div>

</article>
