<article class="relative shrink-0 w-[284px] h-[378px] overflow-hidden rounded-lg">

    <img src="images/{{src()}}" alt="{{alt()}}" class="absolute inset-0 size-full object-cover">

    <div class="absolute inset-x-0 bottom-0 h-[175px] bg-linear-to-b from-transparent to-black"></div>

    <div class="relative flex h-full flex-col justify-end gap-2 p-4 text-white">
        <h3 class="text-3xl/8.5 font-bold">{{title()}}</h3>
        <p class="text-base">{{subtitle()}}</p>
        <div class="flex items-center gap-1 mt-[25px]">
            <p>{{downloadText()}}</p>
            <img src="icons/arrow-download.svg" width="24" height="24" alt="" class="w-6 h-6">
        </div>
    </div>

</article>
