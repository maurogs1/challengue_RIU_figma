<article class="flex flex-col gap-4">
    <img src="images/{{src()}}" alt="{{alt()}}" class="rounded-lg">
    <div class="flex items-center gap-2">
        <img src="icons/{{imgSubtitle()}}.svg" width="24" height="24" alt="{{alt()}}" class="inline-block w-6 h-6">
        <p class="text-base font-bold">{{subtitle()}}</p>
    </div>
    <h3 class="text-[23px]/[25px] font-bold text-black">{{title()}}</h3>
    <p class="text-base line-clamp-6"> {{text()}} </p>
</article>
