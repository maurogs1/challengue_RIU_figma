<section class="flex flex-col gap-12 py-8 px-5">
    <div class="flex flex-col gap-6">
        <h2 class="text-3xl/8 font-bold text-black">Lorem ipsum dolor sit</h2>
        <search class="flex flex-col gap-2.5">

            <label for="buscador" class="text-lg/[27px] text-black">Lorem ipsum dolor sit</label>
            <div
                class="flex items-center gap-2.5 h-10 px-4 rounded-lg bg-custom-gray focus-within:outline-1 focus-within:outline-offset-1">
                <img src="icons/search.svg" alt="" width="16" height="16" class="shrink-0">
                <input id="buscador" type="search" class="w-full bg-transparent outline-none">
            </div>
        </search>
    </div>
    @for(item of catalogList; track item) {
        <app-catalog-card src="{{item.src}}" title="{{item.title}}" subtitle="{{item.subtitle}}" imgSubtitle="{{item.imgSubtitle}}" text="{{item.text}}" alt="{{item.alt}}"></app-catalog-card>
    }
</section>
