<section class="py-8 px-5 md:py-12 md:px-8 lg:py-24 lg:px-8">
    <div class="mx-auto w-full max-w-content flex flex-col gap-8 md:gap-12">
    <div class="flex flex-col gap-6">
        <h2 class="text-section-title md:text-section-title-lg font-bold text-black">Lorem ipsum dolor sit</h2>
        <search class="flex flex-col gap-2.5  md:flex-row md:justify-between md:items-center">

            <label for="buscador" class="text-lg/[27px] text-black">Lorem ipsum dolor sit</label>
            <div class="flex items-center gap-2.5 h-10 px-4 rounded-lg bg-custom-gray focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-custom-red md:w-[300px]">
                <img src="icons/search.svg" alt="" width="16" height="16" class="shrink-0">
                <input id="buscador" type="search" class="w-full bg-transparent focus-visible:outline-none">
            </div>
        </search>
    </div>
    <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">

        @for (item of catalogList; track item.id) {
            <app-catalog-card [src]="item.src" [srcset]="item.srcset" [alt]="item.alt" [title]="item.title" [subtitle]="item.subtitle" [imgSubtitle]="item.imgSubtitle" [text]="item.text" />
        }
        </div>
    </div>
</section>
